<script>
    document.addEventListener("DOMContentLoaded", function () {
      const notifLinks = document.querySelectorAll('.notif-link');
    
      notifLinks.forEach(link => {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          const logId = this.getAttribute("data-log-id");
          const notificationElement = this;
    
          fetch(`/mark_as_read/${logId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
          })
          .then(response => response.json())
          .then(data => {
            if (data.unread_notifications_count !== undefined) {
              // Update counter
              document.getElementById('notif_count').innerText = data.unread_notifications_count;
              document.getElementById('notif_message_count').innerText = data.unread_notifications_count;
    
              // Remove this notification from the UI
              notificationElement.remove();
            }
          })
          .catch(error => {
            console.error("Error:", error);
          });
        });
      });
    });
    </script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
      const userSelect = document.getElementById('user-select');
      const predictionSelect = document.getElementById('prediction-select');
  
      userSelect.addEventListener('change', function () {
          const userId = this.value;
          predictionSelect.innerHTML = '<option value="">Loading...</option>';
  
          fetch(`/get_user_predictions/${userId}`)
              .then(res => res.json())
              .then(data => {
                  predictionSelect.innerHTML = '<option value="">-- Select Prediction --</option>';
                  data.predictions.forEach(pred => {
                      const option = document.createElement('option');
                      option.value = pred.title;
                      option.textContent = pred.title;
                      predictionSelect.appendChild(option);
                  });
              })
              .catch(err => {
                  predictionSelect.innerHTML = '<option value="">Error loading predictions</option>';
              });
      });
  });
  </script>
  

    
<script>

    
    // Flash message handling with SweetAlert2
    const flashMessages = {{ get_flashed_messages(with_categories=True) | tojson | safe }};
    
    if (flashMessages.length > 0) {
        flashMessages.forEach(([category, message]) => {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                background: '#fff',
                color: '#333',
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });

            // Display SweetAlert based on message category
            Toast.fire({
                icon: category === "success" ? "success" : "error", 
                title: message
            });
        });
    }

     // Inactivity timer: User will be logged out after 5 minutes of inactivity
   let timeout;
   
   function resetTimer() {
     clearTimeout(timeout);
     timeout = setTimeout(() => {
       alert("You were inactive for 24 hours. You will now be logged out.");
       window.location.href = "/logout";  // Redirect to logout route
    }, 24 * 60 * 60 * 1000);  // 24 hours in milliseconds
   }
   
   // Reset timer on any activity
   ['click', 'mousemove', 'keypress', 'scroll'].forEach(evt =>
     document.addEventListener(evt, resetTimer)
   );
   
   resetTimer(); // Start timer initially

   // Check if "Remember me" is checked and set the form fields from localStorage
   document.addEventListener("DOMContentLoaded", function() {
     const rememberMe = document.getElementById("rememberMe").checked;

     if (rememberMe) {
       const storedUsername = localStorage.getItem("username");
       const storedPassword = localStorage.getItem("password");

       if (storedUsername && storedPassword) {
         document.getElementById("username").value = storedUsername;
         document.getElementById("password").value = storedPassword;
       }
     }
   });

   // When form is submitted, store username and password in localStorage if "Remember me" is checked
   document.getElementById("login-form").addEventListener("submit", function(event) {
     const rememberMe = document.getElementById("rememberMe").checked;

     if (rememberMe) {
       const username = document.getElementById("username").value;
       const password = document.getElementById("password").value;
       localStorage.setItem("username", username);
       localStorage.setItem("password", password);
     } else {
       localStorage.removeItem("username");
       localStorage.removeItem("password");
     }
   });
   
</script>

<!-- Heartbeat Handler for Active Tab -->
<script>
  (function () {
    let heartbeatIntervalUser;

    function sendUserHeartbeat() {
      fetch("/api/heartbeat", { method: "POST" })
        .then(res => res.json())
        .then(data => console.log("✅ Heartbeat", data.timestamp))
        .catch(err => console.error("❌ Heartbeat error", err));
    }

    function startUserHeartbeat() {
      if (!heartbeatIntervalUser) {
        sendUserHeartbeat();
        heartbeatIntervalUser = setInterval(sendUserHeartbeat, 15000); // 15s
      }
    }

    function stopUserHeartbeat() {
      if (heartbeatIntervalUser) {
        clearInterval(heartbeatIntervalUser);
        heartbeatIntervalUser = null;
        console.log("⛔️ Heartbeat stopped (tab hidden)");
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        console.log("🟢 Tab visible");
        startUserHeartbeat();
        updateSingleUserStatus({{ current_user.id }}); // Refresh on return
      } else {
        console.log("🔴 Tab hidden");
        stopUserHeartbeat();
      }
    });

    if (document.visibilityState === "visible") {
      startUserHeartbeat();
    }
  })();
</script>

<!-- Online Status Checker for All Users -->
<script>
  (function () {
    async function fetchAllUsersStatus() {
      try {
        const response = await fetch("/api/online-status");
        const users = await response.json();

        users.forEach(user => {
          const el = document.getElementById(`user-status-${current_user.id}`);
          if (el) {
            el.innerHTML = user.is_online
              ? `<span class="badge bg-success text-white">Online</span>`
              : `<small class="text-muted">Last seen: ${user.last_seen_ago}</small>`;
          }
        });
      } catch (err) {
        console.error("Error updating all users' status:", err);
      }
    }

    setInterval(fetchAllUsersStatus, 1000); // every second
    window.addEventListener("DOMContentLoaded", fetchAllUsersStatus);
  })();
</script>

<!-- Single User Status Updater (for detailed page) -->
<script>
  (function () {
    async function updateSingleUserStatus(userId) {
      try {
        const response = await fetch(`/api/user-last-active/${userId}`);
        if (!response.ok) throw new Error("Failed to get last active");

        const data = await response.json();
        const el = document.getElementById(`user-last-active-${data.id}`);

        if (el) {
          if (data.is_online) {
            el.innerHTML = `<span class="badge bg-success text-white">Online</span>`;
          } else {
            el.innerHTML = `Last Active: ${data.formatted_time} (${data.last_seen_ago})`;
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    setInterval(() => {
      updateSingleUserStatus({{ current_user.id }});
    }, 5000); // every 5s
  })();
</script>
