<!-- ============================================================
     DYNAMIC SOOYAAL FOOTER
     ============================================================ -->

<footer class="footer">
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <!-- LEFT -->
    <nav class="pull-left">
      <ul class="nav">

        <li class="nav-item">
          <span class="nav-link">
            {{ institution_name }}
          </span>
        </li>

        {% if branch_name %}
        <li class="nav-item">
          <span class="nav-link">
            {{ branch_name }}
          </span>
        </li>
        {% endif %}

      </ul>
    </nav>


    <!-- CENTER -->
    <div class="copyright text-center">

      © {{ current_year or 2026 }}

      <span class="mx-1">•</span>

      <strong>
        {{ institution_name }}
      </strong>

      {% if branch_name %}
        <span class="mx-1">•</span>
        {{ branch_name }}
      {% endif %}

    </div>


    <!-- RIGHT -->
    <div class="text-end">

      <span>
        Education Management System
      </span>

    </div>

  </div>
</footer>
