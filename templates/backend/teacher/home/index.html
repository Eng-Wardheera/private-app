 {% include 'backend/teacher/patial/toast.html' %}

========================================================== -->


<!-- Kaiadmin JS -->
<script src="{{ url_for('static', filename='backend/assets/js/teacher.js') }}"></script>

<!-- SweetAlert CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    
<script>

    
    // Flash message handling with SweetAlert2
    const flashMessages = {{ get_flashed_messages(with_categories=True) | tojson | safe }};
    
    if (flashMessages.length > 0) {
        flashMessages.forEach(([category, message]) => {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                background: '#fff',
                color: '#333',
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });

            // Display SweetAlert based on message category
            Toast.fire({
                icon: category === "success" ? "success" : "error", 
                title: message
            });
        });
    }

     // Inactivity timer: User will be logged out after 5 minutes of inactivity
   let timeout;
   
   function resetTimer() {
     clearTimeout(timeout);
     timeout = setTimeout(() => {
       alert("You were inactive for 24 hours. You will now be logged out.");
       window.location.href = "/logout";  // Redirect to logout route
    }, 24 * 60 * 60 * 1000);  // 24 hours in milliseconds
   }
   
   // Reset timer on any activity
   ['click', 'mousemove', 'keypress', 'scroll'].forEach(evt =>
     document.addEventListener(evt, resetTimer)
   );
   
   resetTimer(); // Start timer initially

   // Check if "Remember me" is checked and set the form fields from localStorage
   document.addEventListener("DOMContentLoaded", function() {
     const rememberMe = document.getElementById("rememberMe").checked;

     if (rememberMe) {
       const storedUsername = localStorage.getItem("username");
       const storedPassword = localStorage.getItem("password");

       if (storedUsername && storedPassword) {
         document.getElementById("username").value = storedUsername;
         document.getElementById("password").value = storedPassword;
       }
     }
   });

   // When form is submitted, store username and password in localStorage if "Remember me" is checked
   document.getElementById("login-form").addEventListener("submit", function(event) {
     const rememberMe = document.getElementById("rememberMe").checked;

     if (rememberMe) {
       const username = document.getElementById("username").value;
       const password = document.getElementById("password").value;
       localStorage.setItem("username", username);
       localStorage.setItem("password", password);
     } else {
       localStorage.removeItem("username");
       localStorage.removeItem("password");
     }
   });
   
</script>

<script>
(function () {

    "use strict";


    /* ============================================================
       TEACHER HEARTBEAT CONFIGURATION
    ============================================================ */

    const HEARTBEAT_INTERVAL = 30000; // 30 seconds
    const HEARTBEAT_TIMEOUT = 10000;  // 10 seconds


    let heartbeatTimer = null;
    let heartbeatRunning = false;


    /* ============================================================
       TEACHER HEARTBEAT
    ============================================================ */

    async function teacherHeartbeat() {

        /* --------------------------------------------------------
           Prevent duplicate requests
        -------------------------------------------------------- */

        if (heartbeatRunning) {
            return;
        }


        /* --------------------------------------------------------
           Do not heartbeat while tab is hidden
        -------------------------------------------------------- */

        if (document.hidden) {
            return;
        }


        heartbeatRunning = true;


        /* --------------------------------------------------------
           AbortController timeout
        -------------------------------------------------------- */

        const controller = new AbortController();

        const timeoutId = setTimeout(
            function () {
                controller.abort();
            },
            HEARTBEAT_TIMEOUT
        );


        try {

            const response = await fetch(
                "/teacher/heartbeat",
                {
                    method: "POST",

                    headers: {
                        "Accept": "application/json"
                    },

                    credentials: "same-origin",

                    signal: controller.signal,

                    cache: "no-store"
                }
            );


            /* ----------------------------------------------------
               Clear timeout
            ---------------------------------------------------- */

            clearTimeout(timeoutId);


            /* ----------------------------------------------------
               Session / authentication failed
            ---------------------------------------------------- */

            if (response.status === 401) {

                console.warn(
                    "🔐 Teacher session expired."
                );

                stopHeartbeat();

                return;
            }


            /* ----------------------------------------------------
               Account not allowed
            ---------------------------------------------------- */

            if (response.status === 403) {

                console.warn(
                    "⛔ Teacher heartbeat forbidden."
                );

                stopHeartbeat();

                return;
            }


            /* ----------------------------------------------------
               Other HTTP errors
            ---------------------------------------------------- */

            if (!response.ok) {

                console.error(
                    "❌ Heartbeat request failed:",
                    response.status,
                    response.statusText
                );

                return;
            }


            /* ----------------------------------------------------
               Parse JSON
            ---------------------------------------------------- */

            const data = await response.json();


            /* ----------------------------------------------------
               Successful heartbeat
            ---------------------------------------------------- */

            if (data.success) {

                console.log(
                    "✅ Heartbeat",
                    data.time
                );

            }

            else {

                console.warn(
                    "⚠️ Heartbeat response:",
                    data.message || "Unknown response"
                );

            }

        }

        catch (error) {

            clearTimeout(timeoutId);


            /* ----------------------------------------------------
               Request was aborted
            ---------------------------------------------------- */

            if (error.name === "AbortError") {

                console.warn(
                    "⏱️ Teacher heartbeat timeout."
                );

            }

            else {

                console.error(
                    "❌ Teacher heartbeat error:",
                    error
                );

            }

        }

        finally {

            heartbeatRunning = false;

        }

    }


    /* ============================================================
       START HEARTBEAT
    ============================================================ */

    function startHeartbeat() {

        /* --------------------------------------------------------
           Don't start while tab is hidden
        -------------------------------------------------------- */

        if (document.hidden) {
            return;
        }


        /* --------------------------------------------------------
           Prevent multiple intervals
        -------------------------------------------------------- */

        if (heartbeatTimer !== null) {
            return;
        }


        console.log(
            "🟢 Teacher heartbeat started"
        );


        /* --------------------------------------------------------
           Immediate heartbeat
        -------------------------------------------------------- */

        teacherHeartbeat();


        /* --------------------------------------------------------
           Every 30 seconds
        -------------------------------------------------------- */

        heartbeatTimer = setInterval(
            function () {

                if (!document.hidden) {

                    teacherHeartbeat();

                }

            },
            HEARTBEAT_INTERVAL
        );

    }


    /* ============================================================
       STOP HEARTBEAT
    ============================================================ */

    function stopHeartbeat() {

        if (heartbeatTimer !== null) {

            clearInterval(
                heartbeatTimer
            );

            heartbeatTimer = null;

        }


        console.log(
            "⛔️ Heartbeat stopped (tab hidden)"
        );

    }


    /* ============================================================
       TAB VISIBILITY
    ============================================================ */

    document.addEventListener(
        "visibilitychange",
        function () {

            /* ----------------------------------------------------
               TAB HIDDEN
            ---------------------------------------------------- */

            if (document.hidden) {

                console.log(
                    "🔴 Tab hidden"
                );

                stopHeartbeat();

            }


            /* ----------------------------------------------------
               TAB VISIBLE
            ---------------------------------------------------- */

            else {

                console.log(
                    "🟢 Tab visible"
                );

                startHeartbeat();

            }

        }
    );


    /* ============================================================
       PAGE LOAD
    ============================================================ */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            startHeartbeat();

        }
    );


    /* ============================================================
       PAGE / BROWSER CLOSE
       
       No heartbeat request is necessary here.
       The last_active timestamp will naturally expire.
    ============================================================ */


    /* ============================================================
       OPTIONAL GLOBAL CONTROL
       
       Can be used elsewhere:
       
       window.startTeacherHeartbeat();
       window.stopTeacherHeartbeat();
    ============================================================ */

    window.startTeacherHeartbeat =
        startHeartbeat;

    window.stopTeacherHeartbeat =
        stopHeartbeat;


})();
</script>

</body>
